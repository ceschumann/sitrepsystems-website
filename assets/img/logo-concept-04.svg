<svg width="520" height="150" viewBox="0 0 520 150" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">SitRep Systems logo concept 4</title>
  <desc id="desc">Solid boxed arrow with cutout center and SitRep Systems wordmark.</desc>
  <defs>
    <linearGradient id="mark" x1="22" y1="124" x2="128" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05243C"/>
      <stop offset="0.72" stop-color="#098AB4"/>
      <stop offset="1" stop-color="#60F6FF"/>
    </linearGradient>
    <mask id="cut">

  </defs>
  <rect x="28" y="24" width="102" height="102" rx="6" fill="url(#mark)" mask="url(#cut)"/>
  <path d="M50 87L82 55L70 43H116V89L105 78L74 109H50V87Z" fill="url(#mark)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
